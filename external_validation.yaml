# External validation of a trained STraTS Chronicle model (inference only):
#   cd src && python external_validation.py --config ../external_validation.yaml
# Relative paths are relative to src/.

# external cohort: raw (unscaled) CSV in Chronicle's long format, like the input of chronicle-preprocess
# (patient_id, time_since_initial_diagnosis, feature_name, feature_value, OS_TIME, OS_EVENT)
cohort: /path/to/external_cohort.csv

# Chronicle scalers of the TRAINING cohort (<chronicle data dir>/scalers, with feature_scalers.pkl).
# null if the cohort is already scaled with them (e.g. chronicle-preprocess --pretrained-scaler-dir).
scaler_dir: /path/to/training_chronicle_dir/scalers

# training run directory with checkpoint_best.bin and inference.pkl (written by main.py)
model_dir: "../outputs/chronicle/strats,num_layers:2,hid_dim:64,num_heads:16,dropout:0.2,attention_dropout:0.2,lr:0.0005|train_frac:1.0|run:1o5"

output_dir: ../outputs/chronicle_external/

# random cut days per patient (C-index mean ± std over draws), as during training
num_eval_draws: 10
seed: 2023
eval_batch_size: 32
