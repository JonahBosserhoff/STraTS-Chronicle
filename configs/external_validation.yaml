# External validation of a trained STraTS Chronicle model (inference only). From the repo root:
#   sbatch scripts/external_validation.sbatch
#   CONFIG=configs/external_validation_site_b.yaml sbatch scripts/external_validation.sbatch
# (or: cd src && python external_validation.py --config ../configs/external_validation.yaml)
# Relative paths are relative to src/.

# external cohort: directory with the output of chronicle-preprocess (<prefix>_{train,val,test}.csv).
# Only the one *_test.csv in it is used (inference on the test split only). It must already be scaled
# with the Chronicle scalers of the TRAINING cohort (chronicle-preprocess --pretrained-scaler-dir);
# no further scaling is done here. Needs the target's columns (OS_TIME, OS_EVENT / TTNT_TIME,
# TTNT_EVENT / label_...).
data_dir: /path/to/external_chronicle_dir

# training run directory with checkpoint_best.bin and inference.pkl (written by main.py). The target
# (and its type) is the one of this run; runs from before --target (no "|target:" in the name) are OS.
# Regression predictions are mapped back to the original units with the label scaler of this run
# (in inference.pkl), as in Chronicle.
model_dir: "../outputs/chronicle/strats,num_layers:2,hid_dim:64,num_heads:16,dropout:0.2,attention_dropout:0.2,lr:0.0005|target:OS|train_frac:1.0|run:1o5"

output_dir: ../outputs/chronicle_external/

# random cut days per patient (metric mean ± std over draws), as during training
num_eval_draws: 10
seed: 2023
eval_batch_size: 32
